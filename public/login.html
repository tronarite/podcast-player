<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrar · Mi biblioteca sonora</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<main class="login">
  <h1>Mi biblioteca sonora</h1>
  <p>Inicia sesión para escuchar.</p>
  <form id="form" autocomplete="on">
    <label class="field"><span>Usuario</span><input name="username" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
    <label class="field"><span>Contraseña</span><input name="password" id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" id="submit" type="submit">Entrar</button>
    <p class="form-error" id="error" role="alert"></p>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
