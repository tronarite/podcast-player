<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<title>Mi biblioteca sonora</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a.6.6 0 0 0 .92.5l10.6-6.8a.6.6 0 0 0 0-1L8.92 4.7a.6.6 0 0 0-.92.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 20 9 12l10-8z"/><path d="M5 19V5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M3 4v6h6"/><path d="M3.5 14a9 9 0 1 0 2.1-9.4L3 10"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M21 4v6h-6"/><path d="M20.5 14a9 9 0 1 1-2.1-9.4L21 10"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m5 12 7 7 7-7"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7"/><path d="m17 15 4 3-4 3z"/></symbol>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></symbol>
  <symbol id="i-plus-c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-queued" viewBox="0 0 24 24"><path d="M4 7h10M4 12h10M4 17h6"/><path d="m14 17 2.5 2.5L21 15"/></symbol>
  <symbol id="i-check-c" viewBox="0 0 24 24"><circle class="cf" cx="12" cy="12" r="9"/><path class="ck" d="m8.2 12.4 2.6 2.6 5-5.2"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
</svg>

<div class="app">
  <aside class="rail">
    <div class="brand">Mi biblioteca</div>
    <nav id="series" class="series-list" aria-label="Series"></nav>
    <div class="rail-foot">
      <button id="settings" class="signout" type="button" aria-label="Ajustes"><svg class="ic"><use href="#i-gear"/></svg><span>Ajustes</span></button>
      <button id="logout" class="signout" type="button" aria-label="Cerrar sesión"><svg class="ic"><use href="#i-out"/></svg><span>Cerrar sesión</span></button>
    </div>
  </aside>
  <main id="main" class="main"><p class="empty">Cargando…</p></main>
</div>

<section id="player" class="player" aria-label="Reproductor" hidden>
  <div class="p-progress"><i id="pBar"></i></div>
  <button id="pClose" class="icon p-close" type="button" aria-label="Minimizar reproductor"><svg class="ic"><use href="#i-down"/></svg></button>
  <button id="pToggle" class="p-track" type="button" aria-label="Ver episodio en reproducción">
    <span id="pCover" class="cover"></span>
    <span class="p-text"><b id="pTitle"></b><small id="pSeries"></small><small id="pChapter" class="p-chapter" hidden></small></span>
  </button>
  <button id="miniPlay" class="icon big p-miniplay" type="button" aria-label="Reproducir"><svg class="ic fill"><use href="#i-play"/></svg></button>
  <div class="p-center">
    <div class="p-buttons">
      <button id="prev" class="icon" type="button" title="Anterior (P)" aria-label="Episodio anterior"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button id="back" class="icon" type="button"><svg class="ic"><use href="#i-back"/></svg><span class="num">15</span></button>
      <button id="play" class="icon big" type="button" title="Reproducir / pausar (Espacio)" aria-label="Reproducir"><svg class="ic fill"><use href="#i-play"/></svg></button>
      <button id="fwd" class="icon" type="button"><svg class="ic"><use href="#i-fwd"/></svg><span class="num">30</span></button>
      <button id="next" class="icon" type="button" title="Siguiente (N)" aria-label="Episodio siguiente"><svg class="ic"><use href="#i-next"/></svg></button>
    </div>
    <div class="p-seek"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posición"><span id="dur">0:00</span></div>
    <p id="pDesc" class="p-desc"></p>
  </div>
  <div class="p-extra">
    <button id="mark" class="icon" type="button" title="Añadir marcador (B)" aria-label="Añadir marcador"><svg class="ic"><use href="#i-mark"/></svg></button>
    <button id="panelBtn" class="icon" type="button" title="Capítulos, marcadores y cola (Q)" aria-label="Capítulos, marcadores y cola" aria-expanded="false"><svg class="ic"><use href="#i-list"/></svg></button>
    <button id="pMore" class="icon" type="button" title="Más opciones" aria-label="Más opciones del episodio" aria-haspopup="menu" aria-expanded="false"><svg class="ic"><use href="#i-more"/></svg></button>
    <select id="speed" title="Velocidad ([ y ])" aria-label="Velocidad">
      <option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option>
      <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option><option value="2.5">2.5×</option>
    </select>
    <label class="sleep"><svg class="ic"><use href="#i-moon"/></svg><select id="sleep" aria-label="Temporizador de apagado">
      <option value="0">Apagado</option><option value="5">5 min</option><option value="15">15 min</option><option value="30">30 min</option>
      <option value="45">45 min</option><option value="60">60 min</option><option value="end">Fin del episodio</option>
    </select><span id="sleepLeft" class="sleep-left" hidden></span></label>
    <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
  </div>
</section>
<aside id="panel" class="panel" aria-label="Capítulos, marcadores y cola" hidden>
  <div class="panel-head"><b>En reproducción</b><button id="panelClose" class="icon" type="button" aria-label="Cerrar panel"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div id="panelBody" class="panel-body"></div>
</aside>
<dialog id="dlg" class="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<audio id="audio" preload="metadata"></audio>
<script src="/app.js"></script>
</body>
</html>
